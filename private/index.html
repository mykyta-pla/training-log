<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e0f11'/%3E%3Cpath d='M4 8h8M4 5.5h8M4 10.5h8' stroke='%23ff7a1a' stroke-width='1.3'/%3E%3C/svg%3E">
  <meta name="googlebot" content="noindex, nofollow">
</head>
<body>
<div class="wrap">

  <header class="mast">
    <a class="home" href="../index.html">notaroutine</a>
    <nav class="top">
      <a href="../builder/">Builder</a>
      <a href="../sessions/">Sessions</a>
      <a href="../videos/">Videos</a>

      <a href="../nutrition/">Nutrition</a>
      <a href="../supplements/">Supplements</a>
      <a href="../travel/">Travel</a>
    </nav>
  </header>


  <div class="gate">
    <h1 style="font-size:1.2rem;margin-bottom:.3rem">Locked</h1>
    <p class="lede" style="font-size:.92rem">Contents are encrypted in the repository.
    The passphrase never leaves this device.</p>
    <form id="f" autocomplete="off">
      <input id="p" type="password" placeholder="passphrase" autocomplete="current-password" aria-label="passphrase">
      <button type="submit">Unlock</button>
    </form>
    <p class="err" id="e"></p>
  </div>

  <script>
  // AES-GCM / PBKDF2 via WebCrypto. Ciphertext is fetched from data.json;
  // nothing readable is served until the correct passphrase is entered.
  const $ = id => document.getElementById(id);
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('e').textContent = '';
    try {
      const blob = await (await fetch('data.json', {cache:'no-store'})).json();
      const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey('raw', enc.encode($('p').value), 'PBKDF2', false, ['deriveKey']);
      const key  = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b(blob.salt), iterations:blob.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(blob.iv)}, key, b(blob.ct));
      document.open(); document.write(new TextDecoder().decode(out)); document.close();
    } catch (err) {
      $('e').textContent = 'Wrong passphrase.';
    }
  });
  </script>


  <footer>
    <p>A personal log. Updated when something changes, not on a schedule.</p>
  </footer>

</div>
</body>
</html>
