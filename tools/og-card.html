<!doctype html>
<!-- The source for og.png. Not served, not linked: tools/render-og.js screenshots
     it at 1200×630 and writes og.png at the repo root. Same six colours, same two
     fonts, same dot field as style.css — kept here rather than in the stylesheet
     because nothing on the site renders this. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Space Grotesk'; font-style: normal; font-weight: 700;
    src: url('../fonts/space-grotesk-700.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500;
    src: url('../fonts/ibm-plex-mono-500.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #f2f2f0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .dots {
    height: 24px;
    background-image: radial-gradient(#d2d2ce 1.7px, transparent 1.8px);
    background-size: 12px 12px;
    margin: 0 -80px;
  }
  .mark {
    font: 500 22px/1 'IBM Plex Mono', monospace;
    letter-spacing: .22em; text-transform: uppercase; color: #8f8f8f;
  }
  h1 {
    font: 700 132px/.94 'Space Grotesk', sans-serif;
    letter-spacing: -.045em; color: #0a0a0a;
  }
  h1 .ko {
    text-decoration: line-through;
    text-decoration-color: #d93c28;
    text-decoration-thickness: 12px;
    text-decoration-skip-ink: none;
  }
  p {
    font: 500 27px/1.45 'IBM Plex Mono', monospace;
    color: #4a4a4a; max-width: 830px; margin-top: 30px;
    letter-spacing: -.005em;
  }
  .foot {
    display: flex; justify-content: space-between; align-items: baseline;
    font: 500 21px/1 'IBM Plex Mono', monospace;
    letter-spacing: .12em; text-transform: uppercase; color: #8f8f8f;
  }
  .foot .n1 { color: #d93c28; }
</style>
</head>
<body>
  <div>
    <div class="mark">notaroutine.life</div>
    <div class="dots" style="margin-top:26px"></div>
  </div>

  <div>
    <h1>not a <span class="ko">routine</span></h1>
    <p>A training log, a session builder that never repeats, and an honest account
       of the parts that aren&rsquo;t working.</p>
  </div>

  <div>
    <div class="dots" style="margin-bottom:26px"></div>
    <div class="foot">
      <span>Training &middot; Nutrition &middot; Supplements &middot; Travel</span>
      <span class="n1">N=1, not medical advice</span>
    </div>
  </div>
</body>
</html>
