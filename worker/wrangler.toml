name = "notaroutine-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# api.notaroutine.life. The zone is notaroutine.life; the apex stays on GitHub
# Pages, so only this subdomain is routed here.
[[routes]]
pattern = "api.notaroutine.life"
custom_domain = true

# The shared movement library. The database and its schema already exist —
# created through the Cloudflare API rather than wrangler — so schema.sql is a
# record of what is there, not something to run. See README.md.
[[d1_databases]]
binding = "DB"
database_name = "notaroutine"
database_id = "b3b94b95-f4d0-4bc7-b60e-ff0134236092"

# Cloudflare's rate limiting, counted at the edge. Nothing about the caller is
# stored here to make it work: the Worker passes a hash, never an address.
# period may only be 10 or 60.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# No observability: request logs would hold addresses and paths, which is
# exactly what this API promises not to keep.
[observability]
enabled = false
