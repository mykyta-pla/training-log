name = "notaroutine-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# api.notaroutine.life. The zone is notaroutine.life; the apex stays on GitHub
# Pages, so only this subdomain is routed here.
[[routes]]
pattern = "api.notaroutine.life"
custom_domain = true

# The shared video library. Four columns and a random id — see schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "notaroutine-videos"
database_id = "PUT-THE-D1-DATABASE-ID-HERE"

# Cloudflare's rate limiting, counted at the edge. Nothing about the caller is
# stored here to make it work: the Worker passes a hash, never an address.
# period may only be 10 or 60.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# No observability: request logs would hold addresses and paths, which is
# exactly what this API promises not to keep.
[observability]
enabled = false
