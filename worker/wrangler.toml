name = "notaroutine-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Kept on beside the custom domain below, not instead of it:
# notaroutine-api.plastomak-nikita.workers.dev is the hostname to curl when you
# need to tell a broken Worker apart from a broken DNS record. The site calls
# api.notaroutine.life and only that.
#
# This line has to sit above [[routes]]. In TOML a bare key after a table
# header belongs to that table, so moved below it this becomes a key inside the
# route rather than a setting for the Worker.
workers_dev = true

# LIVE. This is the custom-domain route: it binds api.notaroutine.life to this
# Worker and asks Cloudflare to create the DNS record for it, which Cloudflare
# can only do for a zone it runs. It was commented out while notaroutine.life
# was on Porkbun — a route that cannot be created fails the whole deploy, even
# though the Worker itself uploads fine.
#
# Both conditions it was waiting on are met:
#
#   1. The zone is on Cloudflare — the .life registry returns
#      paislee.ns.cloudflare.com and theo.ns.cloudflare.com.
#   2. The apex A records for GitHub Pages are DNS-only, grey cloud. Pages
#      serves the site directly and its certificate is untouched. Proxying
#      them would be a separate decision; this route does not make it.
#
# So the deploy that carries this line creates api.notaroutine.life, and
# /videos/ — which has been calling that hostname all along and running its
# API-down path — starts getting answers without a front-end change.
[[routes]]
pattern = "api.notaroutine.life"
custom_domain = true

# The shared movement library: nine columns and two indexes, all of it already
# live. The database and its schema were created through the Cloudflare API
# rather than wrangler, so schema.sql is a record of what is there and not
# something to run. See README.md.
[[d1_databases]]
binding = "DB"
database_name = "notaroutine-videos"
database_id = "a048e123-d723-407b-96a3-f9a2f6077c4b"

# Cloudflare's rate limiting, counted at the edge. Nothing about the caller is
# stored here to make it work: the Worker passes a hash, never an address.
# period may only be 10 or 60.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# No observability: request logs would hold addresses and paths, which is
# exactly what this API promises not to keep.
[observability]
enabled = false
